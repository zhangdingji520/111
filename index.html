<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册登录演示</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { max-width: 450px; width: 100%; background: white; border-radius: 24px; padding: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 28px; color: #1e293b; font-size: 28px; }
        .tabs { display: flex; gap: 12px; margin-bottom: 28px; border-bottom: 1px solid #e2e8f0; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; background: none; border: none; font-size: 18px; font-weight: 500; color: #64748b; transition: 0.2s; }
        .tab.active { color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #334155; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 16px; outline: none; transition: 0.2s; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        button { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 40px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .message { margin-top: 16px; padding: 12px; border-radius: 12px; text-align: center; font-size: 14px; }
        .error { background: #fee2e2; color: #dc2626; }
        .success { background: #dcfce7; color: #15803d; }
        .info { background: #e6f0ff; color: #1e40af; }
        .warning { background: #ffedd5; color: #b45309; }
        .hidden { display: none; }
        footer { text-align: center; margin-top: 24px; font-size: 13px; color: #94a3b8; }
        a { color: #3b82f6; text-decoration: none; }
        .test-btn { background: #64748b; margin-top: 8px; }
        .test-btn:hover { background: #475569; }
    </style>
</head>
<body>
<div class="card">
    <h1>📝 用户中心</h1>
    <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
    </div>

    <div id="loginForm" class="form-container">
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="loginEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="******">
        </div>
        <button id="doLogin">登录</button>
    </div>

    <div id="registerForm" class="form-container hidden">
        <div class="form-group">
            <label>昵称</label>
            <input type="text" id="regNickname" placeholder="如何称呼你">
        </div>
        <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="regEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPassword" placeholder="至少6位">
        </div>
        <button id="doRegister">注册</button>
    </div>

    <div id="statusMsg" class="message hidden"></div>
    <button id="testConnection" class="test-btn">🔧 测试 Supabase 连接</button>
    <footer>
        <a href="admin.html" target="_blank">🔒 管理员后台</a>
    </footer>
</div>

<script>
    // ---------- 你的 Supabase 配置 ----------
    const SUPABASE_URL = "https://hntioocpuhbrwiuvdify.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhudGlvb2NwdWhicndpdXZkaWZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTUwNDIsImV4cCI6MjA5MzU3MTA0Mn0.3kLSZV1scyC89dWVXPi0PZAg7jWVUDG6psHLNUKgvKo";
    // -------------------------------------------

    // 全局显示消息
    function showMessage(text, type = 'error') {
        const msgBox = document.getElementById('statusMsg');
        msgBox.textContent = text;
        msgBox.className = `message ${type}`;
        msgBox.classList.remove('hidden');
        setTimeout(() => msgBox.classList.add('hidden'), 8000);
    }

    // 初始化 Supabase
    let supabase;
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        showMessage('Supabase 初始化成功', 'success');
    } catch (err) {
        showMessage('初始化失败：' + err.message, 'error');
    }

    // UI 元素
    const loginDiv = document.getElementById('loginForm');
    const registerDiv = document.getElementById('registerForm');
    const tabs = document.querySelectorAll('.tab');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.dataset.tab;
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            if (target === 'login') {
                loginDiv.classList.remove('hidden');
                registerDiv.classList.add('hidden');
            } else {
                loginDiv.classList.add('hidden');
                registerDiv.classList.remove('hidden');
            }
        });
    });

    // 注册
    document.getElementById('doRegister').addEventListener('click', async () => {
        const nickname = document.getElementById('regNickname').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        if (!nickname || !email || !password) {
            showMessage('请填写完整信息');
            return;
        }
        if (password.length < 6) {
            showMessage('密码至少6位');
            return;
        }

        if (!supabase) {
            showMessage('Supabase 未初始化，请刷新页面重试', 'error');
            return;
        }

        try {
            // 1. 注册
            const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
            if (authError) {
                showMessage('注册失败：' + authError.message);
                return;
            }
            const userId = authData.user.id;

            // 2. 保存到 profiles 表
            const { error: profileError } = await supabase
                .from('profiles')
                .insert([{ id: userId, email: email, nickname: nickname }]);

            if (profileError) {
                showMessage('注册成功但保存昵称失败：' + profileError.message, 'warning');
            } else {
                showMessage('注册成功！请登录', 'success');
                // 清空表单
                document.getElementById('regNickname').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regPassword').value = '';
                document.querySelector('.tab[data-tab="login"]').click();
            }
        } catch (err) {
            showMessage('注册过程出错：' + err.message, 'error');
        }
    });

    // 登录
    document.getElementById('doLogin').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            showMessage('请输入邮箱和密码');
            return;
        }

        if (!supabase) {
            showMessage('Supabase 未初始化，请刷新页面重试', 'error');
            return;
        }

        try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                showMessage('登录失败：' + error.message);
                return;
            }
            showMessage('登录成功！欢迎 ' + email, 'success');
            setTimeout(() => alert('登录成功，你可以去后台查看用户列表了'), 500);
        } catch (err) {
            showMessage('登录请求异常：' + err.message, 'error');
        }
    });

    // 测试连接按钮
    document.getElementById('testConnection').addEventListener('click', async () => {
        if (!supabase) {
            showMessage('Supabase 客户端未初始化，请检查 URL 和 Key', 'error');
            return;
        }
        showMessage('正在测试 Supabase 连接...', 'info');
        try {
            // 尝试获取当前会话，不依赖登录
            const { data, error } = await supabase.auth.getSession();
            if (error) {
                showMessage('连接失败：' + error.message, 'error');
            } else {
                showMessage('连接成功！当前会话：' + (data.session ? '已登录' : '未登录'), 'success');
            }
        } catch (err) {
            showMessage('测试失败：' + err.message, 'error');
        }
    });

    // 页面加载完成后再检查一次
    window.addEventListener('load', () => {
        if (supabase) {
            console.log("Supabase 就绪");
        } else {
            showMessage('警告：Supabase 未能正确初始化，请检查网络或配置', 'warning');
        }
    });
</script>
</body>
</html>
